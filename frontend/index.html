<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NANOVA INFOTECH - Official Workspace</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #edf2f7;
            --card-bg: #ffffff;
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --secondary: #2563eb;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-blue: rgba(29, 78, 216, 0.22);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 50%, rgba(29, 78, 216, 0.12), transparent 80%), url('/logo.svg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover, 420px;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Royal Blue Glow */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            pointer-events: none;
            z-index: 1;
            opacity: 0.35;
        }
        .glow-1 {
            top: -15%;
            left: -15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #2563eb, transparent 70%);
        }
        .glow-2 {
            bottom: -15%;
            right: -15%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, #60a5fa, transparent 70%);
        }

        /* Professional White & Royal Blue Card */
        .pro-card {
            background: var(--card-bg);
            border: 2px solid var(--border-blue);
            border-radius: 22px;
            box-shadow: 0 25px 50px -12px rgba(29, 78, 216, 0.25),
                        0 0 30px rgba(29, 78, 216, 0.1);
            width: 100%;
            max-width: 440px;
            padding: 2.25rem 2rem;
            margin: auto;
            position: relative;
            z-index: 10;
        }

        /* Logo Display */
        .logo-box {
            width: 100%;
            max-width: 220px;
            margin: 0 auto 1.25rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            width: 100%;
            height: auto;
            max-height: 170px;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(29, 78, 216, 0.3));
        }

        .brand-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #1e40af;
            font-weight: 700;
            margin-bottom: 1.25rem;
            letter-spacing: 0.5px;
        }

        /* Auth Tabs */
        .tab-bar {
            display: flex;
            background: #f1f5f9;
            padding: 0.3rem;
            border-radius: 12px;
            border: 1px solid rgba(29, 78, 216, 0.2);
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.65rem;
            font-size: 0.825rem;
            font-weight: 700;
            border-radius: 9px;
            border: none;
            color: #475569;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(29, 78, 216, 0.4);
        }

        /* Inputs */
        .form-group {
            margin-bottom: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #1e3a8a;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 0.9rem;
            color: #1d4ed8;
            font-size: 0.85rem;
        }

        .form-input {
            background: #f8fafc;
            border: 1.5px solid rgba(29, 78, 216, 0.35);
            color: #0f172a;
            border-radius: 10px;
            padding: 0.75rem 0.9rem 0.75rem 2.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            width: 100%;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 3.5px rgba(29, 78, 216, 0.2);
            background: #ffffff;
        }

        select.form-input option {
            background-color: #ffffff;
            color: #0f172a;
        }

        /* Action Buttons */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 18px rgba(29, 78, 216, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 22px rgba(29, 78, 216, 0.6);
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
        }

        /* Alert Notification */
        .alert-box {
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-box.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }
        .alert-box.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #86efac;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <!-- Full Video Splash Screen Animation -->
    <div id="splash-overlay" onclick="document.getElementById('splash-overlay').style.display='none'" style="position: fixed; inset: 0; z-index: 9999; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; transition: opacity 0.8s ease, visibility 0.8s ease; cursor: pointer;">
        <video id="splash-video" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: contain; max-width: 100vw; max-height: 100vh;">
            <source src="/splash.mp4" type="video/mp4">
            <source src="/images/splash.mp4" type="video/mp4">
        </video>
    </div>

    <!-- MAIN WHITE & ROYAL BLUE CARD -->
    <div class="pro-card">

        <!-- Logo -->
        <div class="logo-box">
            <img src="/logo.svg" alt="Nanova Infotech Logo" class="logo-img">
        </div>
        <p class="brand-subtitle">Nanova Infotech Official Team Workspace</p>

        <!-- Auth Tabs -->
        <div class="tab-bar">
            <button id="tab-login" type="button" onclick="switchAuthTab('login')" class="tab-btn active">
                <i class="fa-solid fa-lock"></i> Sign In
            </button>
            <button id="tab-register" type="button" onclick="switchAuthTab('register')" class="tab-btn">
                <i class="fa-solid fa-user-plus"></i> Join Team
            </button>
        </div>

        <!-- Alert Notification Box -->
        <div id="auth-alert" class="alert-box error hidden"></div>

        <!-- 1. LOGIN FORM -->
        <form id="form-login" onsubmit="handleLogin(event)" autocomplete="off">
            <div class="form-group">
                <label for="login-email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="login-email" required autocomplete="off" inputmode="email" class="form-input" placeholder="kalaimathavan007@gmail.com">
                </div>
            </div>

            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="login-password" required autocomplete="new-password" class="form-input" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="btn-login-submit" class="btn-submit">
                <span>Sign In to Workspace</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <!-- 2. STREAMLINED REGISTER FORM -->
        <form id="form-register" onsubmit="handleRegister(event)" class="hidden" autocomplete="off">
            <div class="form-group">
                <label for="reg-name" class="form-label">Full Name *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="reg-name" required autocomplete="off" class="form-input" placeholder="e.g. Kalaimathavan">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-email" class="form-label">Company Email *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="reg-email" required autocomplete="off" inputmode="email" class="form-input" placeholder="name@nanovainfotech.com">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-team" class="form-label">Department / Team Name *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-building"></i>
                    <input type="text" id="reg-team" required autocomplete="off" class="form-input" placeholder="e.g. Software Development">
                </div>
            </div>

            <div class="form-group">
                <label for="reg-role" class="form-label">Role / Designation *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-tag"></i>
                    <select id="reg-role" required class="form-input">
                        <option value="Software Engineer">Software Engineer</option>
                        <option value="Mobile App Developer">Mobile App Developer</option>
                        <option value="UI/UX Designer">UI/UX Designer</option>
                        <option value="Team Lead">Team Lead</option>
                        <option value="Project Manager">Project Manager</option>
                        <option value="HR & Operations">HR & Operations</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="reg-password" class="form-label">Password *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-key"></i>
                    <input type="password" id="reg-password" required autocomplete="new-password" class="form-input" placeholder="Minimum 6 characters">
                </div>
            </div>

            <button type="submit" id="btn-reg-submit" class="btn-submit">
                <span>Join Nanova Workspace</span>
                <i class="fa-solid fa-user-check"></i>
            </button>
        </form>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const loginEmail = document.getElementById("login-email");
            const loginPass = document.getElementById("login-password");
            if (loginEmail) loginEmail.value = "";
            if (loginPass) loginPass.value = "";

            const splash = document.getElementById("splash-overlay");
            const video = document.getElementById("splash-video");

            const hideSplash = () => {
                if (splash && splash.style.display !== "none") {
                    splash.style.opacity = "0";
                    setTimeout(() => { splash.style.display = "none"; }, 800);
                }
            };

            if (video) {
                video.addEventListener("ended", hideSplash);
                video.addEventListener("error", hideSplash);
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.catch(() => {
                        setTimeout(hideSplash, 2500);
                    });
                }
                setTimeout(hideSplash, 15000);
            } else {
                setTimeout(hideSplash, 1200);
            }

            const token = localStorage.getItem("incubation_token");
            const role = localStorage.getItem("incubation_role");

            if (token && role === "user") {
                window.location.href = "/dashboard.html";
            } else if (role === "admin") {
                localStorage.removeItem("incubation_token");
                localStorage.removeItem("incubation_role");
            }
        });

        function switchAuthTab(tab) {
            const loginBtn = document.getElementById("tab-login");
            const regBtn = document.getElementById("tab-register");
            const loginForm = document.getElementById("form-login");
            const regForm = document.getElementById("form-register");
            const alertBox = document.getElementById("auth-alert");
            alertBox.classList.add("hidden");

            if (tab === "login") {
                loginBtn.classList.add("active");
                regBtn.classList.remove("active");
                loginForm.classList.remove("hidden");
                regForm.classList.add("hidden");
            } else {
                regBtn.classList.add("active");
                loginBtn.classList.remove("active");
                regForm.classList.remove("hidden");
                loginForm.classList.add("hidden");
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById("auth-alert");
            alertBox.classList.remove("hidden", "error", "success");

            if (isError) {
                alertBox.classList.add("error");
                alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> <span>${msg}</span>`;
            } else {
                alertBox.classList.add("success");
                alertBox.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${msg}</span>`;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;

            const submitBtn = document.getElementById("btn-login-submit");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing In...`;

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Login failed.");
                }

                localStorage.setItem("incubation_token", data.access_token);
                localStorage.setItem("incubation_role", data.role);
                localStorage.setItem("incubation_email", data.email);
                localStorage.setItem("incubation_name", data.full_name);
                localStorage.setItem("incubation_team_id", data.team_id || "");
                localStorage.setItem("incubation_team_name", data.team_name || "");

                showAlert("Login Successful! Opening Workspace...", false);
                setTimeout(() => {
                    if (data.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/dashboard.html";
                    }
                }, 400);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In to Workspace</span> <i class="fa-solid fa-arrow-right"></i>`;
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const full_name = document.getElementById("reg-name").value.trim();
            const email = document.getElementById("reg-email").value.trim();
            const team_name = document.getElementById("reg-team").value.trim();
            const role_title = document.getElementById("reg-role").value;
            const password = document.getElementById("reg-password").value;

            const submitBtn = document.getElementById("btn-reg-submit");
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Joining Team...`;

            try {
                const res = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        full_name,
                        email,
                        team_name,
                        idea_title: role_title,
                        domain: "Nanova Team",
                        description: role_title,
                        password
                    })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Registration failed.");
                }

                localStorage.setItem("incubation_token", data.access_token);
                localStorage.setItem("incubation_role", data.role);
                localStorage.setItem("incubation_email", data.email);
                localStorage.setItem("incubation_name", data.full_name);
                localStorage.setItem("incubation_team_id", data.team_id || "");
                localStorage.setItem("incubation_team_name", data.team_name || "");

                showAlert("Registered Successfully! Opening Workspace...", false);
                setTimeout(() => {
                    if (data.role === "admin") {
                        window.location.href = "/admin.html";
                    } else {
                        window.location.href = "/dashboard.html";
                    }
                }, 400);

            } catch (err) {
                showAlert(err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Join Nanova Workspace</span> <i class="fa-solid fa-user-check"></i>`;
            }
        }
    </script>
</body>
</html>
