plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nanova.infotech'
    compileSdk 34

    defaultConfig {
        applicationId "com.nanova.infotech"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding false
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "NANOVA_INFOTECH.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}

tasks.configureEach { task ->
    if (task.name == 'assembleDebug') {
        task.doLast {
            def apkFile = file("${layout.buildDirectory.get()}/outputs/apk/debug/NANOVA_INFOTECH.apk")
            if (!apkFile.exists()) {
                apkFile = file("${layout.buildDirectory.get()}/outputs/apk/debug/app-debug.apk")
            }
            if (apkFile.exists()) {
                copy {
                    from apkFile
                    into rootProject.rootDir
                    rename { "NANOVA_INFOTECH.apk" }
                }
                def localAppBuildDir = file("${rootProject.rootDir}/app/build/outputs/apk/debug")
                localAppBuildDir.mkdirs()
                copy {
                    from apkFile
                    into localAppBuildDir
                    rename { "NANOVA_INFOTECH.apk" }
                }
            }
        }
    }
}
